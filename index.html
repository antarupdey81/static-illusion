<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hidden Text MP4 Generator</title>
  <script src="https://cloudflare.com"></script>
  <style>
    body { background: #222; color: #fff; font-family: sans-serif; text-align: center; margin: 20px; }
    #controls { margin-bottom: 15px; }
    input, button { padding: 10px; font-size: 16px; border-radius: 5px; border: none; margin: 5px; }
    button { background: #007bff; color: white; cursor: pointer; font-weight: bold; }
    button:disabled { background: #555; }
    canvas { border: 2px solid #555; display: block; margin: 0 auto; }
  </style>
</head>
<body>

  <h1>Kinematic Camouflage MP4 Exporter</h1>
  <div id="controls">
    <input type="text" id="textInput" value="HELLO HUMAN" placeholder="Type secret text...">
    <button id="recordBtn">Download MP4</button>
  </div>
  <div id="canvas-container"></div>

  <script>
    let textToHide = "HELLO HUMAN";
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;

    function setup() {
      let cnv = createCanvas(600, 400);
      cnv.parent('canvas-container');
      
      document.getElementById('textInput').addEventListener('input', (e) => {
        textToHide = e.target.value;
      });

      document.getElementById('recordBtn').addEventListener('click', startRecording);
    }

    function draw() {
      for (let i = 0; i < 40; i++) {
        stroke(random(255));
        strokeWeight(random(1, 4));
        line(random(width), 0, random(width), height);
      }

      push();
      textSize(64);
      textAlign(CENTER, CENTER);
      textStyle(BOLD);
      noStroke();
      
      let xOffset = sin(frameCount * 0.15) * 6; 
      
      drawingContext.globalCompositeOperation = 'difference';
      fill(15); 
      text(textToHide, width / 2 + xOffset, height / 2);
      pop();
    }

    function startRecording() {
      let btn = document.getElementById('recordBtn');
      btn.disabled = true;
      btn.innerText = "Recording (3s)...";
      
      recordedChunks = [];
      let stream = document.querySelector('canvas').captureStream(30); 
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        let blob = new Blob(recordedChunks, { type: 'video/mp4' });
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a');
        a.href = url;
        a.download = 'static-hidden-text.mp4';
        a.click();
        
        btn.disabled = false;
        btn.innerText = "Download MP4";
      };

      mediaRecorder.start();
      
      setTimeout(() => {
        mediaRecorder.stop();
      }, 3000);
    }
  </script>
</body>
</html>
