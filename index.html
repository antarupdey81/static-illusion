<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hidden Text MP4 Generator</title>
  <script src="https://cloudflare.com"></script>
  <style>
    body { background: #222; color: #fff; font-family: sans-serif; text-align: center; margin: 20px; }
    #controls { margin-bottom: 15px; }
    input, button { padding: 10px; font-size: 16px; border-radius: 5px; border: none; margin: 5px; }
    button { background: #007bff; color: white; cursor: pointer; font-weight: bold; }
    button:disabled { background: #555; }
    canvas { border: 2px solid #555; display: block; margin: 0 auto; }
  </style>
</head>
<body>

  <h1>Kinematic Camouflage MP4 Exporter</h1>
  <div id="controls">
    <input type="text" id="textInput" value="HELLO HUMAN" placeholder="Type secret text...">
    <button id="recordBtn">Download MP4</button>
  </div>
  <div id="canvas-container"></div>

  <script>
    let textToHide = "HELLO HUMAN";
    let mediaRecorder;

    let isRecording = false;

    function setup() {
      let cnv = createCanvas(600, 400);

let textToHide = "HELLO HUMAN";
let mediaRecorder;
let recordedChunks = [];

function setup() {
  // Reduced size slightly to prevent mobile memory crashes
  let cnv = createCanvas(500, 350);
  cnv.parent('canvas-container');
  
  document.getElementById('textInput').addEventListener('input', (e) => {
    textToHide = e.target.value;
  });

  document.getElementById('recordBtn').addEventListener('click', startRecording);
}

function draw() {
  // Optimized static loop to consume less mobile GPU memory
  for (let i = 0; i < 30; i++) {
    stroke(random(255));
    strokeWeight(random(1, 3));
    line(random(width), 0, random(width), height);
  }

  push();
  textSize(54);
  textAlign(CENTER, CENTER);
  textStyle(BOLD);
  noStroke();
  
  let xOffset = sin(frameCount * 0.15) * 6; 
  
  drawingContext.globalCompositeOperation = 'difference';
  fill(15); 
  text(textToHide, width / 2 + xOffset, height / 2);
  pop();
}

function startRecording() {
  let btn = document.getElementById('recordBtn');
  btn.disabled = true;
  btn.innerText = "Recording...";
  
  recordedChunks = [];
  let stream = document.querySelector('canvas').captureStream(25); // Safe 25 FPS for mobile
  
  // Uses universal mobile VP8 container instead of strict MP4 to stop the crashing
  mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8' });

  mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = () => {
    let blob = new Blob(recordedChunks, { type: 'video/webm' });
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    // Android media player reads webm instantly, or you can rename extension to .mp4
    a.download = 'hidden-text.webm'; 
    a.click();
    
    btn.disabled = false;
    btn.innerText = "Download Video";
  };

  mediaRecorder.start();
  
  setTimeout(() => {
    mediaRecorder.stop();
  }, 3000);
}
</script>
</body>
</html>
